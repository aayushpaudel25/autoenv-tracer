name: 'AutoEnv Compliance Gate'
description: 'Traces runtime dependencies, verifies security policies, scans CVEs, comments on PRs, and builds containers.'
inputs:
  run-script:
    description: 'Path to target Python script to execute'
    required: true
runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install AutoEnv & Dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -e .

    - name: Run Headless Capture & Generate SBOM
      shell: bash
      run: python -m autoenv.cli capture --run ${{ inputs.run-script }} --json > autoenv_report.json

    - name: Evaluate Compliance Policy
      shell: bash
      run: python -m autoenv.cli check-policy --report autoenv_report.json --policy autoenv_policy.json

    - name: Scan Dependencies for CVEs
      shell: bash
      run: python -m autoenv.cli scan-cves --sbom sbom.json

    - name: Verify Container Build
      shell: bash
      run: |
        echo "[*] Testing container build with Dockerfile.autoenv..."
        docker build -f Dockerfile.autoenv -t autoenv-app:test .

    - name: Post Pull Request Review Comment
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: python -m autoenv.cli comment-pr