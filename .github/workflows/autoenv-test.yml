name: AutoEnv CI Compliance Gate

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

jobs:
  compliance-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run AutoEnv Compliance Check
        uses: ./.github/actions/autoenv-action
        with:
          run-script: "--module http.server" # Replace with a script in your repo to trace