name: 'AutoEnv Enterprise Compliance'

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  compliance-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run AutoEnv CI Gatekeeper
        uses: ./.github/actions/autoenv-action
        with:
          run-script: 'test_script.py'